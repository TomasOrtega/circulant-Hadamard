name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run prek
        run: uv run --locked prek -a --quiet

  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check and build TeX
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2026
          run: |
            make -C tex check
            make -C tex
      - uses: actions/upload-artifact@v7
        with:
          name: tex-documents
          path: |
            tex/build/report.tex
            tex/build/report.pdf
            tex/build/slides.pdf
          if-no-files-found: error

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build website
        run: make -C website
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/dist/
          if-no-files-found: error
