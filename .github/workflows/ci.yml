name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group narration
      - name: Run prek
        run: uv run --locked prek -a --quiet
      - name: Check narration
        run: uv run --locked --group narration python -m unittest discover -s narration/tests -t .

  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check published PDFs
        run: |
          python3 -m unittest discover -s tex/tests -t .
          make -C tex check-pdfs
      - name: Check and build TeX
        uses: xu-cheng/latex-action@v4
        with:
          texlive_version: 2026
          working_directory: tex
          pre_compile: make check
          root_file: |
            build/report.tex
            slides.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build
      - uses: actions/upload-artifact@v7
        with:
          name: tex-documents
          path: |
            tex/build/report.tex
            tex/build/report.pdf
            tex/build/slides.pdf
          if-no-files-found: error

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Check website
        run: make -C website check
      - name: Build website
        run: make -C website
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/dist/
          if-no-files-found: error
